<!DOCTYPE html> 
<html lang="en">
<head> 

    <title>Quest Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="proofOfConcept.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
</head> 

<body>
<main>
<h1>Welcome to Quest Manager</h1>

<div class="container-fluid">

<p>Task Points: <span id="counter"></span></p>

<input type="text" id="taskInput" placeholder="Add a new task...">

<button id="addButton" onclick="addTask()">+</button>
<ul id="taskList"></ul>

<script>
    var counter = document.getElementById("counter");
    var completedCount = 0;

    function addTask() {
        var input = document.getElementById("taskInput");
        var list = document.getElementById("taskList");
        

        if (input.value.trim() === "") { //so that it doesnt empty
            return;
        }

        // Create a new list item
        var li = document.createElement("li");
        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        var text = document.createElement("span");
        text.textContent = " " + input.value;

        checkbox.onclick = function() { //crossing out

            if (checkbox.checked) {
                text.classList.add("completed");
                //completedCount++;
            } else {
                text.classList.remove("completed");
                //completedCount--;
            }

            var checkedBoxes = list.querySelectorAll(`input[type="checkbox"]:checked`);
            counter.textContent = checkedBoxes.length;
        };
        
        li.appendChild(checkbox);
        li.appendChild(text);

        list.appendChild(li);
        input.value = ""; //clears input
    }

    //counter.textContent = completedCount;
</script>

</div>

<div class="container-fluid">
<figure>
    <img src="my_character.jpg" class="img-fluid" width="350px" alt="default character">
</figure>
</div>

</main>
</body>
</html>
